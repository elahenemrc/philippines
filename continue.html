<!DOCTYPE html>
<html lang="en">
<body>
       <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eeeeee;
        }

        .container {
            background: #ffffff;
            width: 90%;
            max-width: 420px;
            padding: 45px 30px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.10);
        }

        .icon {
            width: 75px;
            height: 75px;
            background: #e5e5e5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
            font-size: 32px;
        }

        h2 {
            color: #333333;
            font-size: 23px;
            margin-bottom: 15px;
        }

        p {
            color: #777777;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .yes {
            background: #555555;
            color: white;
        }

        .yes:hover {
            background: #333333;
            transform: translateY(-3px);
        }

        .no {
            background: #e5e5e5;
            color: #444444;
        }

        .no:hover {
            background: #cccccc;
            transform: translateY(-3px);
        }

        #message {
            margin-top: 25px;
            font-size: 14px;
            color: #555555;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">?</div>

        <h2>Continue Using Your Account?</h2>

        <p>
            Do you want to continue to use this account?
            Please select Yes or No to proceed.
        </p>

        <div class="buttons">
            <button class="yes" onclick="continueAccount()">
                Yes
            </button>

            <button class="no" onclick="exitAccount()">
                No
            </button>
        </div>

        <div id="message"></div>

    </div>

    <script>
        function continueAccount() {
            document.getElementById("message").innerHTML =
                "Welcome back! You can continue using your account.";

                 window.location.href = "file:///C:/Users/HP/Desktop/ELAINE/index.html";
        }

        function exitAccount() {
            document.getElementById("message").innerHTML =
                "You have chosen not to continue using this account.";

                         window.location.href = "file:///C:/Users/HP/Desktop/ELAINE/index.html";
        }
    </script>

</body>
</html>
